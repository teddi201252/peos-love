# Starlight app bundle for make test-love: LÖVE (build/love/love-peos/love)
# with the test game in game/. The title sorts first, so the test finds it
# at the top of the dock. gpu: OpenGL; jit: LuaJIT's machine code (pages
# RW, then RX); shm: the window's pixels; audio: OpenAL's sound; the game's
# save directory in /starlight/config/love/lovecheck.
title=0 LÖVE check
category=strumenti
dock=yes
exec=./app.bin
args=/system/apps/lovecheck.app/game
capabilities=gpu, jit, fs.read, fs.write, shm, audio
paths=/system/apps/lovecheck.app:r, /starlight/config:rw
width=640
height=480
min_width=320
min_height=240
