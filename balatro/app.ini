# Starlight app bundle: Balatro, the user's own copy on LÖVE 11.5 for PeOS
# (userland/ports/love, docs/game-ports-plan.md). app.bin is LÖVE; the game
# is the user's: setup/ (a small LÖVE game in the bundle) finds Balatro.love
# (the Mac's Steam copy) or Balatro.exe (Windows') on a USB stick or in
# /home, copies its zip to /starlight/config/love/Balatro and restarts;
# from then on "--first" opens the copy (its saves are in the same folder).
# gpu: OpenGL (Mesa: iris on the Intel GPU, virgl in a VM); jit: LuaJIT's
# machine code (pages RW, then RX); shm: the window's pixels; audio: the
# game's sounds and music; fs.write: the copy and the saves.
# paths: at most 8 (PEOS_PATH_MAX_GRANTS).
title=Balatro
version=1.0.0
author=LocalThunk (the game, the user's copy); LÖVE 11.5 (zlib), ported by PeOS
category=svago
dock=yes
store_category=giochi
min_peos=0.18.0
exec=./app.bin
args=--first /starlight/config/love/Balatro/Balatro.love setup
capabilities=gpu, jit, fs.read, fs.write, shm, audio
paths=/system/apps/balatro.app:r, /apps/balatro.app:r, /media1:r, /media2:r, /media3:r, /media4:r, /home:r, /starlight/config:rw
icon=res:icon
width=1280
height=760
min_width=640
min_height=400

# Resources
[resources]
icon=./resources/icon.png
